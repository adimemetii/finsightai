{% extends "base.html" %}
{% block title %}{{ t('auth.signup.title') }} - FinSight AI{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-6 col-md-8 mx-auto">
        <div class="card shadow-lg border-0">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="fas fa-user-plus fa-3x text-success"></i>
                    <h2 class="mt-3">{{ t('auth.signup.title') }}</h2>
                    <p class="text-muted">{{ t('auth.signup.body') }}</p>
                </div>

                <form method="POST" action="{{ url_for('signup') }}" data-submit-state>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold" for="signup-name">{{ t('auth.signup.full_name') }}</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-user"></i></span>
                                <input id="signup-name" type="text" name="name" class="form-control" required autocomplete="name"
                                       placeholder="{{ t('auth.signup.full_name.ph') }}">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold" for="signup-company">{{ t('auth.signup.company') }}</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-building"></i></span>
                                <input id="signup-company" type="text" name="company_name" class="form-control" required autocomplete="organization"
                                       placeholder="{{ t('auth.signup.company.ph') }}">
                            </div>
                        </div>
                    </div>
                    <div class="mt-3">
                        <label class="form-label fw-bold" for="signup-email">{{ t('auth.email') }}</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                            <input id="signup-email" type="email" name="email" class="form-control" required autocomplete="email"
                                   placeholder="{{ t('auth.signup.email_ph') }}">
                        </div>
                    </div>
                    <div class="mt-3 mb-4">
                        <label class="form-label fw-bold" for="signup-password">{{ t('auth.password') }}</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input id="signup-password" type="password" name="password" class="form-control" required autocomplete="new-password"
                                   minlength="6" placeholder="{{ t('auth.signup.password.ph') }}">
                        </div>
                        <small class="text-muted">{{ t('auth.signup.password.help') }}</small>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-success btn-lg">
                            <i class="fas fa-user-plus"></i> {{ t('auth.signup.create') }}
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4">
                    <small class="text-muted">{{ t('auth.signup.have_account') }}</small>
                    <a href="{{ url_for('login') }}" class="ms-1">{{ t('auth.signup.to_login') }}</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
