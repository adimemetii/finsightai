{% extends "base.html" %}
{% block title %}{{ t('nav.login') }} - FinSight AI{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-5 col-md-7 mx-auto">
        <div class="card shadow-lg border-0">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="fas fa-sign-in-alt fa-3x text-primary"></i>
                    <h2 class="mt-3">{{ t('auth.login.title') }}</h2>
                    <p class="text-muted">{{ t('auth.login.body') }}</p>
                </div>

                <form method="POST" action="{{ url_for('login') }}" data-submit-state>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label fw-bold" for="login-email">{{ t('auth.login.email_label') }}</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                            <input id="login-email" type="email" name="email" class="form-control" required autofocus autocomplete="email"
                                   placeholder="{{ t('auth.login.email_ph') }}">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold" for="login-password">{{ t('auth.password') }}</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input id="login-password" type="password" name="password" class="form-control" required autocomplete="current-password"
                                   placeholder="{{ t('auth.login.password_ph') }}">
                        </div>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-sign-in-alt"></i> {{ t('auth.login.submit') }}
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4">
                    <small class="text-muted">{{ t('auth.login.no_account') }}</small>
                    <a href="{{ url_for('signup') }}" class="ms-1">{{ t('auth.login.to_signup') }}</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
