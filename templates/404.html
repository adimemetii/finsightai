{% extends "base.html" %}

{% block title %}{{ t('error.404.heading') }} - FinSight AI{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-6 mx-auto text-center py-5">
        <h1 class="display-1 fw-bold text-danger mb-4">
            <i class="fas fa-exclamation-triangle"></i> 404
        </h1>
        <h2 class="mb-3">{{ t('error.404.heading') }}</h2>
        <p class="lead text-muted mb-4">
            {{ t('error.404.body') }}
        </p>
        <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">
            <i class="fas fa-home"></i> {{ t('error.404.home') }}
        </a>
    </div>
</div>
{% endblock %}
