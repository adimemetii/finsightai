services:
  - type: web
    name: finsight-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    # The current session cache is process-local; one worker keeps the demo
    # flow consistent while datasets remain durable in the database.
    startCommand: python init_db.py && gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL_CA
        sync: false
      - key: MAX_CONTENT_LENGTH
        value: "16777216"
      - key: ALLOWED_EXTENSIONS
        value: csv,xlsx,xls,json
