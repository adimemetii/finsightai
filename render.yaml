services:
  - type: web
    name: finsight-ai
    runtime: python
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    # The current session cache is process-local; one worker keeps the demo
    # flow consistent while datasets remain durable in the database.
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: GROQ_TIMEOUT
        value: "45"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL_CA
        sync: false
      - key: DB_CONNECT_TIMEOUT
        value: "10"
      - key: MAX_CONTENT_LENGTH
        value: "16777216"
      - key: MAX_DATA_COLUMNS
        value: "200"
      - key: MAX_DATA_ROWS
        value: "1000000"
      - key: ALLOWED_EXTENSIONS
        value: csv,xlsx,xls,json
